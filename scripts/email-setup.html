<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Connect Gmail · Marketplace</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f3f4f6;
        color: #1c2533;
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Arial,
          sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 440px);
        background: white;
        border: 1px solid #dce0e5;
        border-radius: 12px;
        padding: 30px;
      }
      h1 {
        font-size: 23px;
        letter-spacing: -0.03em;
        margin: 0 0 8px;
      }
      p {
        color: #606770;
        margin: 0 0 24px;
      }
      label {
        display: block;
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 7px;
      }
      input {
        width: 100%;
        height: 44px;
        border: 1px solid #ccd2dc;
        border-radius: 6px;
        padding: 10px 12px;
        font: inherit;
        margin-bottom: 20px;
      }
      input:focus {
        outline: 2px solid #1865d8;
        outline-offset: 2px;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 6px;
        background: #1865d8;
        color: white;
        padding: 12px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      small {
        display: block;
        margin-top: 16px;
        color: #606770;
        font-size: 12px;
      }
      a {
        color: #1865d8;
      }
      #status {
        margin-top: 18px;
        color: #b42318;
      }
      #status.success {
        color: #25623d;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Connect Gmail</h1>
      <p>Use your Gmail address and Google app password.</p>
      <form id="setup">
        <label for="email">Gmail address</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
          placeholder="you@gmail.com"
        />
        <label for="password">App password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          required
          spellcheck="false"
          placeholder="16-character app password"
        />
        <button type="submit">Save email settings</button>
        <small
          >Saved only to this project’s local .env file.
          <a href="https://myaccount.google.com/apppasswords" target="_blank" rel="noreferrer"
            >Create a Google app password</a
          >
        </small>
      </form>
      <div id="status" role="status" aria-live="polite"></div>
    </main>
    <script nonce="__SETUP_TOKEN__">
      const form = document.getElementById('setup'),
        status = document.getElementById('status');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = form.querySelector('button');
        button.disabled = true;
        status.textContent = 'Checking Gmail connection…';
        try {
          const response = await fetch('/configure', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Setup-Token': '__SETUP_TOKEN__' },
            body: JSON.stringify({ email: form.email.value.trim(), password: form.password.value }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error);
          form.reset();
          form.hidden = true;
          status.className = 'success';
          status.textContent = 'Gmail connected. Settings saved locally. You can close this page.';
        } catch (error) {
          status.textContent = error.message;
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
