<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Marketplace — Stripe setup</title>
  <style>
    body {
      font:
        16px/1.5 system-ui,
        sans-serif;
      background: #f3f4f6;
      color: #1c2533;
      margin: 0;
      padding: 48px 20px;
    }
    main {
      max-width: 480px;
      margin: 5vh auto;
      background: white;
      border: 1px solid #dce0e5;
      border-radius: 12px;
      padding: 32px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 12px;
    }
    p {
      color: #606770;
    }
    label {
      display: block;
      font-weight: 600;
      margin: 24px 0 8px;
    }
    input,
    button {
      box-sizing: border-box;
      width: 100%;
      font: inherit;
      border-radius: 6px;
      padding: 12px;
    }
    input {
      border: 1px solid #adb6c3;
    }
    button {
      background: #1865d8;
      color: white;
      border: 0;
      cursor: pointer;
      margin-top: 16px;
      font-weight: 600;
    }
    button:disabled {
      opacity: 0.65;
    }
    input:focus-visible,
    button:focus-visible {
      outline: 3px solid #8ab9ff;
      outline-offset: 3px;
    }
    #status {
      min-height: 24px;
      font-size: 14px;
    }
  </style>
  <main>
    <h1>Connect the sandbox</h1>
    <p>
      Enter the Stripe secret key supplied with your test. It stays on this computer and is saved
      privately for Marketplace.
    </p>
    <form>
      <label for="key">Sandbox secret key</label
      ><input
        id="key"
        name="key"
        type="password"
        autocomplete="off"
        spellcheck="false"
        placeholder="sk_test_…"
        required
      /><button>Verify and save</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script nonce="__SETUP_TOKEN__">
    document.querySelector('form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const field = document.querySelector('input'),
        button = document.querySelector('button'),
        status = document.querySelector('#status');
      button.disabled = true;
      status.textContent = 'Verifying with Stripe…';
      try {
        const response = await fetch('/configure', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Setup-Token': '__SETUP_TOKEN__' },
          body: JSON.stringify({ key: field.value }),
        });
        const result = await response.json();
        if (!response.ok) throw Error(result.error);
        field.value = '';
        field.disabled = true;
        status.textContent = 'Saved. You can close this page and reply “configured” in Codex.';
        button.textContent = 'Sandbox key saved';
      } catch (error) {
        status.textContent = error.message;
        button.disabled = false;
      }
    });
  </script>
</html>
